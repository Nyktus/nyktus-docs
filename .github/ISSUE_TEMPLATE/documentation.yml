name: Documentation problem
description: Report a page that is wrong, unclear or missing. Security issues go through the private advisory link instead.
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page, or the page that should exist.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: What did you try to do, and where did the page not help?
    validations:
      required: true
