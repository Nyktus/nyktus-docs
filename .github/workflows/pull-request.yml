name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # The title is attacker-controlled. It is passed through the environment and
      # never interpolated into the script, which would allow command injection.
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].{0,99}$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::The pull request title must follow Conventional Commits, for example 'feat(alerting): deliver alerts to Teams'. It becomes the commit message and the changelog entry."
            exit 1
          fi

  dco:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Dependabot and the app that opens the release pull requests cannot sign
      # off. Their commits are exempt only in pull requests that they opened,
      # because anyone can set the author of a commit, but not the author of a
      # pull request.
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
        run: |
          dependabot='dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>'
          release_bot="${RELEASE_APP_SLUG}[bot]"
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if [[ "$PR_AUTHOR" == "dependabot[bot]" && "$author" == "$dependabot" ]]; then
              continue
            fi
            if [[ -n "$RELEASE_APP_SLUG" && "$PR_AUTHOR" == "$release_bot" && "$(git log -1 --format='%an' "$sha")" == "$release_bot" ]]; then
              continue
            fi
            if ! git log -1 --format='%B' "$sha" | grep --quiet --line-regexp --fixed-strings "Signed-off-by: $author"; then
              echo "::error::Commit $sha has no sign-off matching its author. Use 'git commit -s'."
              status=1
            fi
          done
          exit "$status"
