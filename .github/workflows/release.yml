name: Release

# A tag "vX.Y.Z" releases the documentation: the workflow builds the site and uploads it to
# Hetzner Webhosting over SFTP. The release pull request creates the tag. A manual run builds
# main or a tag and can list the changes of an upload without making them. See DEPLOYMENT.md
# for the setup.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what an upload would change and change nothing
        type: boolean
        default: false

permissions:
  contents: read

# Two uploads at once would race on the same files. A release is never canceled half way.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    # Only main and release tags are published, whoever starts the run.
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SFTP_HOST: ${{ secrets.HETZNER_SFTP_HOST }}
      SFTP_USER: ${{ secrets.HETZNER_SFTP_USER }}
      SFTP_KEY: ${{ secrets.HETZNER_SFTP_KEY }}
      SFTP_KNOWN_HOSTS: ${{ secrets.HETZNER_SFTP_KNOWN_HOSTS }}
      # A variable, or a secret if you stored it as one.
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
      SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      # The values end up in a command line of lftp, so only plain characters pass. The site is
      # mirrored with deletion, and it shares its package with the landing page in the folder
      # above: a path outside a subfolder of public_html would delete that site.
      - name: Check the settings
        run: |
          missing=
          for name in SFTP_HOST SFTP_USER SFTP_KEY SFTP_KNOWN_HOSTS DEPLOY_PATH; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set (see DEPLOYMENT.md):$missing"
            exit 1
          fi
          printf '%s' "$SFTP_HOST" | grep -Eq '^[A-Za-z0-9.-]+$' || { echo "::error::HETZNER_SFTP_HOST holds characters that a host name does not"; exit 1; }
          printf '%s' "$SFTP_USER" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "::error::HETZNER_SFTP_USER holds unexpected characters"; exit 1; }
          printf '%s' "$SFTP_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo "::error::SFTP_PORT must be a number"; exit 1; }
          printf '%s' "$DEPLOY_PATH" | grep -Eq '^public_html/[A-Za-z0-9_-][A-Za-z0-9._/-]*$' || { echo "::error::DEPLOY_PATH must be a subfolder of public_html, such as public_html/docs"; exit 1; }

      # The history gives every page the date of its last change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag $TAG is not a version of the documentation."
            exit 1
          fi
          # Only a commit of main is released, whoever pushed the tag.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get install --yes --no-install-recommends lftp

      # StrictHostKeyChecking=yes with a pinned host key: the upload fails instead of trusting
      # whoever answers. .well-known belongs to the server and is neither uploaded nor deleted. The
      # .htaccess comes from src/public and is part of the site.
      - name: Upload
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"' EXIT
          printf '%s\n' "$SFTP_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          options="--reverse --delete --parallel=4 --no-perms --verbose --exclude-glob .well-known/"
          if [ "$DRY_RUN" = true ]; then options="$options --dry-run"; fi
          lftp -e "
            set cmd:fail-exit yes
            set net:max-retries 2
            set sftp:auto-confirm no
            set sftp:connect-program 'ssh -a -x -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts'
            open -u '$SFTP_USER,' sftp://$SFTP_HOST:$SFTP_PORT
            mirror $options .vitepress/dist '$DEPLOY_PATH'
            bye
          "
