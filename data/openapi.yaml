      operationId: createHoneytoken
      summary: Create a honeytoken
      description: |
        Creates a honeytoken with a new trigger value of 128 random bits. Place
        its `trigger_url`, or for a `dns` one of its `trigger_names`, where an
        attacker would find it. The trigger value cannot be changed: to replace
