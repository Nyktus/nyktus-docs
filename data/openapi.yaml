      responses:
        "200":
          description: The deceptions of the catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDeceptionList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/catalog/deceptions/{id}:
