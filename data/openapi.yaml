        - name: lang
          in: query
          description: The language of the texts. Without it, they are English.
          schema:
            type: string
            enum: [en, de]
      responses:
        "200":
          description: The deception.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDeception"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /api/v1/catalog/artifacts:
    get:
      operationId: listCatalogArtifacts
      summary: List the artifacts of the catalog
      description: |
        Returns every artifact of the catalog, ordered by identifier. An
        artifact is a template of a file that a person places, such as an SSH
        configuration; deceptions recommend artifacts, and an artifact exists
        without a deception. The catalog ships with Nyktus and is the same in
        every installation, so the list is complete and not paged, and it holds
        no inventory.
      tags: [catalog]
      x-access: catalog:read
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - name: lang
          in: query
          description: The language of the texts. Without it, they are English.
          schema:
            type: string
            enum: [en, de]
      responses:
        "200":
          description: The artifacts of the catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogArtifactList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/catalog/artifacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
