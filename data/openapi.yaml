          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
        - name: type
          in: query
          description: Lists only honeytokens of this type.
          schema:
            type: string
            enum: [web_url, web_image, dns]
        - name: enabled
          in: query
          description: Lists only enabled (`true`) or disabled (`false`) honeytokens.
