      description: |
        Returns honeytokens from the newest to the oldest, a page at a time. To
        read the next page, pass the `next_cursor` of a response as `cursor`,
        with the same filters.

        Honeytokens are part of the inventory: whoever reads them knows which
        URLs to avoid. Give integrations that do not manage honeytokens keys
