          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
        - name: status
          in: query
          description: |
            Lists only incidents with one of these statuses, separated by
            commas, such as `open,acknowledged` for every incident that is not
            closed.
          schema:
            type: string
            pattern: "^(open|acknowledged|closed)(,(open|acknowledged|closed))*$"
        - name: resource_id
          in: query
          description: |
            Lists only the incidents of this scenario, or of this honeytoken or
            honeypot while it stood alone. The events of a honeytoken or honeypot
            in a scenario belong to the incidents of the scenario.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

