        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateArtifact
      summary: Change the placement notes of an artifact
      description: |
        Sets where the artifact was placed. Nothing else of an artifact can be
        changed: its content, name and format are what applying the deception
        rendered, and it leaves its scenario only when the scenario is deleted.

        The audit log records the change as `artifact.update` with the field
        `placement_notes`, not its value. A request that changes nothing is not
        recorded.
      tags: [artifacts]
      x-access: artifacts:write
      security:
        - sessionCookie: []
