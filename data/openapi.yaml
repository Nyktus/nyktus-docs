          description: The scenario after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteScenario
      summary: Delete a scenario
      description: |
        Deletes a scenario. The parameters `honeytokens`, `honeypots` and
        `artifacts` choose what happens to its honeytokens, honeypots and
        artifacts: `keep` removes them from the scenario, and they stand
        alone; `delete` deletes them with it. Events and incidents remain
        either way. `honeypots=delete` also requires the permission
        `honeypots:write`, because only that permission puts a honeypot into
        a scenario; without it, the request receives `403`.

        The audit log records the deletion as `scenario.delete`, and each
        honeytoken, honeypot and artifact as `honeytoken.update`,
        `honeypot.update` or `artifact.update` with the field `scenario_id`,
        or as `honeytoken.delete`, `honeypot.delete` or `artifact.delete`, all
        in one transaction.
      tags: [scenarios]
      x-access: scenarios:write
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - name: honeytokens
          in: query
          description: |
            What happens to the honeytokens of the scenario: `keep` (the
            default) leaves them alone, `delete` deletes them.
          schema:
            type: string
            enum: [keep, delete]
        - name: honeypots
          in: query
          description: |
            What happens to the honeypots of the scenario: `keep` (the
            default) leaves them alone, `delete` deletes them.
          schema:
            type: string
            enum: [keep, delete]
        - name: artifacts
          in: query
          description: |
            What happens to the artifacts of the scenario: `keep` (the
            default) leaves them alone, `delete` deletes them.
          schema:
            type: string
            enum: [keep, delete]
      responses:
        "204":
          description: The scenario has been deleted.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/scenarios/{id}/deceptions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addScenarioDeception
      summary: Add a deception to a scenario
      description: |
        Adds a deception of the catalog to a scenario that exists: its
        honeytokens, which join the scenario, its artifacts (those that the
        deception recommends unless `artifacts` names a selection), rendered
        with the URLs and names of those honeytokens, and its guide in the chosen
        language. Everything is created in one transaction: an error leaves
        nothing behind.

        A deception joins a scenario at most once; a second application with
        other values of the persona needs a scenario of its own.

        The persona belongs to the scenario and only grows. A value that the
        scenario has stays: the request may repeat it or leave it out, and a
        different value is refused with `409` and the code `persona_conflict`,
        which names the key but neither value. A key that the scenario lacks is
        added. A scenario holds at most 20 deceptions and 200 artifacts (`409`,
        `scenario_limit`).

        The permission `scenarios:write` covers the honeytokens and artifacts
        that the request creates, as for applying a deception. The audit log
        records each honeytoken as `honeytoken.create`, each artifact as
        `artifact.create` and the scenario as `scenario.update` with the
        changed fields `deceptions`, and `persona` and `engage_activities` if
        they changed. The Engage activities of the scenario gain those that
        follow from what joined, up to 20.
      tags: [scenarios]
      x-access: scenarios:write
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDeceptionRequest"
      responses:
        "201":
          description: The scenario after the change, with the honeytokens and artifacts that were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppliedDeception"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A value of the persona differs from the one the scenario has (`persona_conflict`), the deception
            is part of the scenario already (`deception_already_added`), or the scenario holds the most
            deceptions or artifacts it may (`scenario_limit`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The deception has a `dns` honeytoken, but the console knows no zone of the DNS role
            (`dns_not_configured`), or a value would make an artifact reveal what it is
            (`artifact_reveals_decoy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/scenarios/{id}/artifacts:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addScenarioArtifact
      summary: Add an artifact of the catalog to a scenario
      description: |
        Adds an artifact of the catalog to a scenario that exists, rendered once
        with the persona of the scenario, new random secrets and the
        honeytokens that `bindings` names for its slots, and never rendered
        again. The honeytokens must belong to the scenario and be of a type that
        the slot takes (`400` otherwise, without saying whether a honeytoken of
        that identifier exists elsewhere). A slot that is optional and left out
        makes the file pocket litter; a required slot needs a honeytoken.

        The persona grows as for `addScenarioDeception`: a key that the artifact
        asks for and the scenario lacks is added, a different value for a key
        that the scenario has is refused with `409` and the code
        `persona_conflict`. A password that the file names is not the one of the
        older files of the scenario, because every artifact generates its own
        secrets.

        The permission `scenarios:write` covers the artifact. The audit log
        records it as `artifact.create` and, if the persona or the Engage
        activities of the scenario changed, the scenario as `scenario.update`
        with the changed fields.
      tags: [scenarios]
      x-access: scenarios:write
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddArtifactRequest"
      responses:
        "201":
          description: The artifact and the scenario after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedArtifact"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A value of the persona differs from the one the scenario has (`persona_conflict`), or the scenario
            holds the most artifacts it may (`scenario_limit`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            A bound honeytoken is a `dns` honeytoken, but the console knows no zone of the DNS role
            (`dns_not_configured`), or a value would make the file reveal what it is
            (`artifact_reveals_decoy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/scenarios/{id}/guide:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getScenarioGuide
      summary: Get the guides of a scenario
      description: |
        Returns the guide of each deception of the scenario, in the order the
        deceptions joined, as they were rendered, in Markdown, in the language
        in which each joined. A guide names the honeytokens and values of the
        scenario and tells where to place its artifacts and how to test them.
        A scenario put together by hand holds no deception and has no guides.
      tags: [scenarios]
      x-access: scenarios:read
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        "200":
          description: The guides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioGuides"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

