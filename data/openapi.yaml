            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The scenario does not exist (`scenario_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: detachHoneytokenScenario
      summary: Remove a honeytoken from its scenario
      description: |
        Removes a honeytoken from its scenario. The honeytoken stays and
        stands alone: its next events open an incident of their own. A
        honeytoken that stands alone stays as it is.

        The audit log records the change as `honeytoken.update` with the field
