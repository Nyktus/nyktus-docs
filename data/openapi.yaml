              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateScenario
      summary: Change a scenario
      description: |
        Changes the name, the notes or the Engage activities of a scenario.
        Members that are left out stay unchanged; `engage_activities: []`
        removes the activities. The deception that a scenario was created from
        cannot be changed, and resources join and leave a scenario through
        operations of their own.

        The audit log records the names of the changed fields as
        `scenario.update`, not their values. A request that changes no value
        is not recorded.
      tags: [scenarios]
      x-access: scenarios:write
      security:
        - sessionCookie: []
        - bearerKey: []
