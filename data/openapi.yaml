          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/artifacts/{id}/content:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadArtifact
      summary: Download an artifact
      description: |
        Returns the content of an artifact as a file to save
        (`Content-Disposition: attachment` with its `file_name`), with the
        media type of its format, `X-Content-Type-Options: nosniff`,
        `Content-Security-Policy: default-src 'none'; sandbox` and
        `Cache-Control: no-store`, so that a browser never renders an artifact
        in the origin of the console.

        The audit log records downloads as `artifacts.read`, at most once per
        user or API key and minute, without naming the artifact.
      tags: [artifacts]
      x-access: artifacts:read
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        "200":
          description: The content of the artifact.
          headers:
            Content-Disposition:
              description: '`attachment` with the `file_name` of the artifact.'
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/incidents:
    get:
      operationId: listIncidents
      summary: List incidents
      description: |
        Returns incidents from the most recently opened to the oldest, a page at
        a time. To read the next page, pass the `next_cursor` of a response as
        `cursor`, with the same filters.
      tags: [incidents]
      x-access: incidents:read
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - name: limit
          in: query
