  /api/v1/honeytokens/{id}/scenario:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: assignHoneytokenScenario
      summary: Assign a honeytoken to a scenario
      description: |
        Assigns a honeytoken that stands alone to a scenario. From then on,
        its events are correlated into the open incident of the scenario. An
        open incident of the honeytoken itself stays open until it is
        triaged or closes after its inactivity. Assigning a honeytoken to its
        own scenario again changes nothing.

        A honeytoken that belongs to another scenario receives `409` with the
        code `honeytoken_in_scenario`: remove it from that scenario first, so
        that nothing takes a honeytoken from a scenario by mistake. A scenario
        that does not exist receives `422` with the code `scenario_not_found`.

        The audit log records the change as `honeytoken.update` with the field
        `scenario_id`. A request that changes nothing is not recorded.
      tags: [honeytokens]
      x-access: honeytokens:write
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignScenarioRequest"
      responses:
        "200":
          description: The honeytoken after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Honeytoken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The honeytoken belongs to another scenario (`honeytoken_in_scenario`).
