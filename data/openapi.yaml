        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The request creates a `dns` honeytoken, but the console knows no zone of the DNS role (`dns_not_configured`).
