  /api/v1/catalog/deceptions/{id}/apply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    post:
      operationId: applyCatalogDeception
      summary: Apply a deception of the catalog
      description: |
        Creates a scenario from a deception: its honeytokens, which join the
        scenario, its artifacts, rendered with the URLs and names of those
        honeytokens, the values of the persona and new random secrets, and its
        guide in the chosen language. The artifacts are those that the
        deception recommends unless `artifacts` names a selection. Everything
        is created in one transaction: an error leaves nothing behind. The
        scenario is a snapshot; a later change of the catalog does not change
        it. Further deceptions and artifacts join the scenario later, see
        `addScenarioDeception` and `addScenarioArtifact`.

        A DNS honeytoken is named under the first zone of the DNS role in the
        artifacts. Without zones, a deception with a DNS honeytoken receives
        `422` with the code `dns_not_configured`. An application whose values
        would make an artifact name the product or what it is, such as a zone
        or a value of the persona that contains "canary", receives `422` with
        the code `artifact_reveals_decoy`.

        The permission `scenarios:write` covers the honeytokens and artifacts
        that applying creates. The audit log records each honeytoken as
        `honeytoken.create`, the scenario as `scenario.create` and each
        artifact as `artifact.create`.
      tags: [catalog, scenarios]
      x-access: scenarios:write
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyDeceptionRequest"
      responses:
        "201":
          description: The scenario with its honeytokens and artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppliedDeception"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The deception has a `dns` honeytoken, but the console knows no zone of the DNS role
            (`dns_not_configured`), or a value would make an artifact reveal what it is
            (`artifact_reveals_decoy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/honeytokens:
